<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2435" viewBox="0 0 1440 2435" role="img" aria-labelledby="title desc">
<title id="title">Thermal meta-devices task routes</title>
<desc id="desc">Twenty authored stages P01–P20 describe one paper-level design. Twelve coverage families and twelve child scopes remain distinct. Three physical reference device families, CLOAK, ROTATOR45 and CONCENTRATOR18, each have X/Y condition views. These six cells and static views are not six independent specimens; source independent and technical counts remain unknown. B01–B04 retain reported experimental/media scope; B05–B10 and their children retain analytical/numerical source scope with no execution. B11/B12 are authored controls/reliability, not newly claimed source experiments. Nine source conflicts and thirteen unresolved-input groups remain held. The 2-norm versus squared-error ambiguity, Eq.16 residual index, coarsest cloak label 3.0 versus curve endpoint 2.5, and physical-unit/absolute-flux uncertainties are not silently repaired. The source method mixes analytical and iterative numerical elements. No optimizer, FEM solver or metric computation is implemented. Fifteen source facts and all reported experimental/numerical outcomes are reference material, never measured episode telemetry, rewards or success thresholds. K1/R1/C1 to X and K2/R2/C2 to Y are authored visual selectors; only the parallel/transverse profile relation is source-reported. A reported 37-degree-Celsius boundary and 45-minute interval are historical context, not commands or safe-release criteria. Preparation remains a per-specimen chain; supplier lots and common jobs never replace family-specific design, lattice, intermediate and final-specimen parents. Six repeat/reorientation/rework/control/next-preparation loops remain unexpanded and require approved plans plus safe release. Every powered failure or stop at P11–P14 routes to P15; indeterminate release retains SERVICE_CUSTODY_HOLD. Administrative closeout cannot release custody or claim success. Fabrication, casting, thermal, wet and electrical work stay closed qualified services. Nominal source dimensions and original illustrative shapes do not qualify geometry, grasps or robot motion. Upstream review covered ten main pages, twelve SI pages, five main and seven SI figures, nine SI notes and six sampled frames per movie across three decoded movies. Movies were not continuously reviewed or calibrated to raw acquisition time. Zenodo README was read; matrices, source code, raw experimental data and optional peer review remain unread. This integration does not reread publications, recompute results or reproduce science. No heat-flow telemetry, new scientific measurement or physical execution is supplied. Source inventory inspection only; no chronology is inferred. No scientific execution claimed.</desc>
