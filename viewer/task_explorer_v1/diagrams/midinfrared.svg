<title id="title">Mid-infrared single-pixel imaging task routes</title>
<desc id="desc">Eight experimental design branches and twenty-two authored operation templates represent one paper-level design. Approximately 10 Hz is a source reference only for analog 16x16 dynamic imaging; analog 32x32 retains approximately 2.5 Hz. Neither rate is a hardware default, a photon-counting rate or a timing measurement from movie playback. Incident mean photons per pulse, detected counts, physical displays, dose and elapsed time remain distinct. B01 requires spatial diagnostics with the object removed; bucket-only sensing does not establish pump/SFG correspondence. B05 detector mode and exposure policy remain null under U14; same power does not establish equal dose. Baseline/denoised comparisons require identical raw parents, and copper grids cannot be inherited by silicon. Twelve controls, ten source conflicts and fourteen unresolved-input groups remain open and claim-local. Independent sample/run/day counts remain unspecified and prospective qualification is mandatory. Failed attempts, current detector epochs, exclusive leases, safe access, occupied supported holds and closed accounting remain distinct. Upstream review covered nine main pages, twelve technical SI pages, eleven figures and one media-description page. Movies were fully decoded and sampled, not reviewed continuously. Raw data and modified source code remain unavailable. No source reanalysis, independent mathematical proof, physical safety qualification or scientific validation is supplied. All fabrication, optical alignment, detector-change and dynamic-target services remain closed, qualified and unimplemented. Original scene geometry, dimensions, interfaces and anchors are illustrative and unqualified; they grant no motion permission. Source inventory inspection only; no chronology is inferred. No scientific execution claimed.</desc>
