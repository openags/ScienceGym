<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1775" viewBox="0 0 1440 1775" role="img" aria-labelledby="title desc">
<title id="title">Woven metamaterials task routes</title>
<desc id="desc">WHOLE-PAPER DESIGN, NOT REPRODUCTION. The 24 scientific design routes and 48 symbolic operations cover design scope whose source suite reports 96 synthetic contract configurations, with 11 static scene groups and 43 symbolic anchors; none is a physical trial, qualified device, source-exact CAD or scientific result. Default QUALIFICATION_HOLD is a separate inspection record, not a 25th scientific route. Eleven source conflicts and twelve required input gates remain unresolved or scope-controlled. Tetrakaidecahedron remains held without blocking unaffected topologies. Physical and numerical pattern maps, failure variables and geometry contexts cannot substitute for one another. Plasma/coating relative order requires an external order card; source partial order is preserved. Full fabrication versus independently prepared intake keep distinct lineage and preparation credit. Mount, calibration, control, sample and attempt revisions require independent current evidence; requests are never observations. BCC compression, BCC tension and octahedron compression cycles remain distinct. Signed closed-cycle loss differs from loading work and is not made positive with absolute value. Unknown isolation stays contained; damage is quarantined. All hazardous work stays inside closed externally qualified services, none implemented. Complete written main/SI design coverage does not mean videos were played or workbook values inspected. Only source agent_visible.json is actor context; this public inspector includes evaluator-only material and is not actor-safe. Source inventory inspection only; no chronology is inferred. No scientific execution claimed.</desc>
