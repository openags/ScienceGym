<title id="title">Graphene quantum Hall arrays task routes</title>
<desc id="desc">Fifteen authored stages R00–R14 and eleven coverage branches describe one paper-level design. Eleven original scene groups and thirty-two symbolic anchors are illustrative and unqualified. Each 118-element parallel subarray has nominal resistance R_K/236, approximately 109 ohm. The whole 236-element device connects two subarrays in series, R_K/118, approximately 219 ohm. Subarrays, the whole device, a separate Hall bar and external references must retain separate identities. Twenty-nine source facts, eighteen ambiguities and fourteen author-reported outcomes are reference material, never generated measurement telemetry, actor reward or success thresholds. Twenty unresolved-input groups, fourteen controls, null repeat counts and null planned conditions remain explicit. The five-edge comparison graph is distinct from acquired edges, which may remain empty, partial, failed or held. Disputed loop algebra and Eq. 1 remain unresolved; pooled precision, Allan-limited per-set uncertainty and standard offsets are distinct. R09 nonquantizing controls remain required design coverage without requiring unsafe acquisition. R10/R11 optional acquisition stays separate from design coverage. R14 joins every actually started service job after R03, including partial failures, independently of analysis success. Microfabrication, cryogenics, magnetic fields, electrical work and precision instruments remain closed qualified services. Source ranges and reported maxima are historical facts, never operating defaults. Upstream review read and visually inspected nine main pages and four SI pages, with all main-table cells. Raw data, source code, CAD and optional peer review remain unread. No video was listed in the inspected technical inventory. This integration does not reread publications, recompute source results or resolve scientific inconsistencies. No physical execution, hardware control, electrical or physics simulation, qualified motion, new scientific measurements or scientific reproduction is supplied. Source inventory inspection only; no chronology is inferred. No scientific execution claimed.</desc>
