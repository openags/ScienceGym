<desc id="desc">BOUNDED NONBIOLOGICAL SUBSET; not a complete whole-paper design. Default FLOW_HOLD preserves the unresolved 40x flow conflict; no pump setting is chosen or averaged. Three optical profiles and the 589.29 nm reference remain distinct. Cartridge retention, calibration revisions, session teardown, immutable sample/reference/frame lineage and excluded biological scope remain explicit. Main Figs 2-4 pixels and raw source data remain uninspected. No open-beam operation or numerical PCA execution. Source inventory inspection only; no chronology is inferred. No scientific execution claimed.</desc>
