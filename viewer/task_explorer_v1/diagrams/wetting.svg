<title id="title">Wetting transitions on soft materials task routes</title>
<desc id="desc">Sixteen source design routes and seventy-four authored operation contracts remain distinct from the separate metadata-only default qualification-hold view. Ten source conflicts and twenty-five unresolved input groups remain open and claim-local. Cadmium-containing quantum-dot synthesis, ink handling and high-voltage deposition remain unmodeled closed external preparation; only a sealed specimen and independent receipt boundary is shown. Commercial silicone preparation and all hardware/analysis services remain unimplemented. Independent macro measurements, film specimens, image timepoints, fiducial sites, reference configurations and inverse-model results are not interchangeable replicates. No inferred 44-condition phase matrix, resolved thickness/modulus conflict, guessed missing SI Fig. 9 workbook, trusted source outcome or cTFM solver is supplied. Main text and all fifteen written SI pages were read upstream; main/SI figures were inspected. The movie was sampled at six times only, never continuously reviewed; workbook numerical cells remain unread. Original scene dimensions and anchors are illustrative, unqualified interfaces; no real physics, safe grasp or robot motion is established. Source inventory inspection only; no chronology is inferred. No scientific execution claimed.</desc>
