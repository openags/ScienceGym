<title id="title">Anomalous acoustic scattering task routes</title>
<desc id="desc">Five experimental branches B01–B05 and four numerical-review extensions A01–A04 remain distinct. Three preparation/calibration records and one authored closeout are separate supporting scope. Fourteen symbolic operations, eleven scene groups and thirty-two anchors describe one paper-level design. The reported apparatus is a suspended torsion pendulum, not free-flight levitation. M1 and M2 have thirty cells; M3 has twenty; cell counts are not independent replicates. Source repeat counts remain unknown and prospective counts remain null. Eight ambiguities and sixteen unresolved-input groups stay explicit. Screen pixels, angles, displacement, force, modeled force per length and normalized force remain separate; reported trends are not success thresholds. Experimental 8 cm and self-guiding numerical 12 cm separations are distinct historical facts, never operating defaults. Requests do not prove completion or safe release. Current scoped calibration, sign and clock transformations, typed raw data, failed attempts and accepted supported custody remain required. Fabrication, acoustic/electrical actuation, laser calibration, source motion and safe release remain closed qualified services. Upstream review read eight main pages, eight SI pages, the media-description sheet and five tables with 152 entries. Three movies were decoded and 6/6/5 frames sampled, not continuously reviewed. Additional supporting data, code and CAD remain unread; bounded update checking is not exhaustive. This integration does not reread papers or prove mathematics. No physical execution, acoustic actuation, simulation, qualified motion, exposure-safety certification or scientific reproduction is supplied. Source inventory inspection only; no chronology is inferred. No scientific execution claimed.</desc>
