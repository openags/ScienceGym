<title id="title">Parallel AFM bounded metrology task routes</title>
<desc id="desc">BOUNDED INERT IMAGING / METROLOGY ONLY; not full fabrication. The calibrated array or lever remains installed while targets or coupons are exchanged. Branch tails do not unmount the retained probe. Final session teardown invalidates calibration; calibration cannot be reused between episodes. Two incomplete fabrication preparation contracts remain separately gated. Prefabricated inputs never earn historical fabrication credit. Prospective extensions are not experiments. Unordered inventory only; exact source contracts remain unexpanded. No scientific execution claimed.</desc>
