<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2270" viewBox="0 0 1440 2270" role="img" aria-labelledby="title desc">
<title id="title">Lockable flat-foldable origami task routes</title>
<desc id="desc">Thirty scientific design routes, sixty symbolic operations and 143 finite synthetic bookkeeping fixtures remain distinct. The default qualification hold and three other global hold views are navigation records, not additional scientific routes. Full fabrication, prepared intake and cut-coupon preparation retain separate ancestry and credit. Machine/cross direction, regular/irregular mode, mode and configuration revisions, first peak versus densification maximum, engaged fit windows, signed open-path work and residual set (not closed-loop loss), virgin/cycled/damaged status and controls remain explicit. Three main-compression specimens, five per density scale and five finite-size specimens per geometry differ from ten N4/four N6 cycles; mixed-mode modulus/area denominators and crosshead/DIC gauge lengths remain distinct. Eleven source conflict/scope records and nine required-input gates are not resolved by this display. Twelve movies were sampled at six positions each, not continuously played; peer-review contents were not read. Static illustrative folds are not source-exact CAD, validated contact, grasps or mechanics. Source inventory inspection only; no chronology is inferred. No scientific execution claimed.</desc>
